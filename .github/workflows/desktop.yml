name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run check
      - run: npm run desktop:prepare
      - run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ReplyMate-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*Setup.exe
          if-no-files-found: error
          retention-days: 7
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ReplyMate-*
          merge-multiple: true
          path: installers
      - name: Create checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --title "ReplyMate $RELEASE_TAG · 桌面安装版" --notes-file docs/release-v2.4.0.md
