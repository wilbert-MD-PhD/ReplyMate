appId: org.replymate.desktop
productName: ReplyMate
copyright: Copyright © 2026 wilbert
asar: true
directories:
  output: dist/desktop
  buildResources: desktop
  app: build/core
files:
  - '**/*'
  - '!desktop/smoke.cjs'
  - '!node_modules/**'
mac:
  category: public.app-category.productivity
  icon: desktop/icon.icns
  identity: null
  target:
    - dmg
  artifactName: ReplyMate-${version}-macOS-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: 答伴通过浏览器录音，将提问转换为原语言文字。
win:
  icon: desktop/icon.ico
  target:
    - nsis
  artifactName: ReplyMate-${version}-Windows-${arch}-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  runAfterFinish: true
linux:
  icon: desktop/icon.png
  target:
    - AppImage
  category: Office
  artifactName: ReplyMate-${version}-Linux-${arch}.${ext}
